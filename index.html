*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  color:var(--ink);font-family:var(--f-hand);color-scheme:dark;overflow:hidden;
  background:
    radial-gradient(120% 70% at 88% 4%,rgba(255,255,255,.07),transparent 60%),
    linear-gradient(158deg,var(--bg1) 0%,var(--bg2) 100%);
  background-color:var(--bg1);
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--mint);outline-offset:3px;border-radius:14px}
.grain{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.3;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.c-q,.c-title,.opt,.g-desc,.g-tag,.g-name,.note,.lead,.hint,.t,.need{word-break:keep-all;overflow-wrap:break-word;text-wrap:balance}
.gl{width:78px;margin:26px auto 0;opacity:.85}

/* screens */
.screen{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;display:none;-webkit-overflow-scrolling:touch}
.screen.on{display:block;animation:fadein .45s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{width:100%;max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(var(--dock) + 56px + env(safe-area-inset-bottom,0px))}

/* wordmark + logo */
.wm{display:inline-flex;flex-direction:column;gap:5px;font-family:var(--f-geo);line-height:1}
.wm b{font-weight:700;font-size:38px;letter-spacing:.05em}
.wm span{font-weight:500;font-size:9.5px;letter-spacing:.62em;opacity:.85}
.logo{aspect-ratio:1/1;background:var(--logo);-webkit-mask:var(--logo-url) center/contain no-repeat;mask:var(--logo-url) center/contain no-repeat}

/* cover */
.cover{display:none}
.cover.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
.cover .wm{position:absolute;left:max(20px,calc(50% - 240px + 4px));top:calc(env(safe-area-inset-top,0px) + 26px);color:#cfeaf2}
.stage{position:relative;width:min(100vw,520px);aspect-ratio:1688/1850;margin-top:-4vh}
.stage .logo{position:absolute;left:8%;top:10.5%;width:64%;--logo:#22a67c;filter:drop-shadow(0 0 22px rgba(34,166,124,.18))}
.arc{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 14px rgba(190,235,245,.45))}
.start{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);left:50%;transform:translateX(-50%);font-family:var(--f-title);font-size:18px;letter-spacing:.06em;padding:12px 26px;white-space:nowrap;border-radius:999px;border:1.5px solid rgba(238,247,244,.6);background:rgba(15,36,41,.25);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(238,247,244,.07)}}

/* headings */
.h-serif{font-family:var(--f-serif);font-weight:400;letter-spacing:.1em;line-height:1;margin:0;font-size:42px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lead{font-family:var(--f-title);font-size:20px;line-height:1.4;margin:12px 0 0;text-align:right;letter-spacing:.02em}
.chip{font-family:var(--f-title);font-size:15px;padding:6px 13px;border:1.5px solid rgba(238,247,244,.55);border-radius:999px;white-space:nowrap;transition:.25s}
.chip.full{border-color:var(--mint);color:var(--mint);box-shadow:0 0 14px rgba(156,242,213,.3)}
.hint{font-size:16px;color:var(--ink-2);margin:8px 0 0;line-height:1.5}

/* chalk circles */
.stack{display:flex;flex-direction:column;margin-top:22px}
.circle{position:relative;width:var(--d);aspect-ratio:1;margin:-10px 0;display:block;text-align:center;color:var(--ink);transition:transform .25s,opacity .35s}
.circle:nth-child(odd){align-self:flex-start;margin-left:-4px}
.circle:nth-child(even){align-self:flex-end;margin-right:-4px}
.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;color:rgba(238,247,244,.92);transition:color .3s,filter .3s;pointer-events:none}
.ring path{fill:none;stroke:currentColor;stroke-width:.95;stroke-linecap:round;stroke-linejoin:round}
.circle.sel .ring{color:var(--mint);filter:drop-shadow(0 0 5px rgba(156,242,213,.6))}
.circle.sel::before{content:"";position:absolute;inset:5%;border-radius:50%;background:radial-gradient(closest-side,rgba(156,242,213,.17),rgba(156,242,213,.05) 72%,transparent)}
.circle.dim{opacity:.42}
.circle:active:not(.dim){transform:scale(.985)}
.inner{position:absolute;inset:11.5%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px}
.badge{position:absolute;top:9%;right:11%;font-family:var(--f-title);font-size:13px;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--mint);color:var(--night);opacity:0;transform:scale(.8);transition:.25s;z-index:2}
.circle.sel .badge{opacity:1;transform:none}
.c-title{font-family:var(--f-title);font-size:22px;line-height:1.25;margin:0}
.c-q{margin:0;font-size:18px;line-height:1.45;font-weight:400}
.c-q+.c-q{margin-top:6px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* actions */
.actions{position:sticky;bottom:calc(var(--dock) + 4px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px -18px 0;padding:30px 18px 8px;z-index:5;background:linear-gradient(to top,var(--bg2) 40%,transparent)}
.btn{white-space:nowrap;font-family:var(--f-title);font-size:16px;letter-spacing:.02em;padding:11px 18px;border-radius:999px;border:1.5px solid rgba(238,247,244,.5);background:rgba(15,36,41,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:.2s}
.btn:active{transform:scale(.97)}
.actions.flat{position:static;background:none;margin:26px 0 0;padding:0}
.btn.primary{background:var(--mint);border-color:var(--mint);color:var(--night)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.ghost{background:transparent;border-color:rgba(238,247,244,.28);color:var(--ink-2)}

/* identity */
.opt{display:block;width:100%;padding:8px 10px;border-radius:18px;font-size:17.5px;line-height:1.45;font-weight:700;text-align:center;transition:.2s;box-shadow:inset 0 0 0 1.5px transparent}
.opt.on{background:rgba(156,242,213,.16);box-shadow:inset 0 0 0 1.5px rgba(156,242,213,.6)}
.opt.off{opacity:.46}
.vs{font-family:var(--f-title);font-size:15px;letter-spacing:.24em;opacity:.7;margin:-2px 0}
.id-head{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.id-head .logo{width:56px;--logo:#2eae95;background:linear-gradient(160deg,#27a97c,#3a8fc4)}
.id-head .h-serif{font-size:46px}

/* result */
.note{font-family:var(--f-title);font-size:19px;line-height:1.55;text-align:center;margin:14px auto 0;max-width:330px}
.res-head{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.hold{position:relative;width:132px;height:132px;margin:16px auto 0;border-radius:50%;display:grid;place-items:center;touch-action:none;-webkit-touch-callout:none;background:rgba(15,36,41,.4);font-family:var(--f-title);font-size:16px;line-height:1.35;text-align:center}
.hold svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.hold circle{fill:none;stroke-width:4}
.hold .track{stroke:rgba(238,247,244,.28)}
.hold .prog{stroke:var(--mint);stroke-linecap:round;stroke-dasharray:371;stroke-dashoffset:371}
.hold.holding .prog{animation:fill 1.1s linear forwards}
.hold.holding{transform:scale(.97)}
@keyframes fill{to{stroke-dashoffset:0}}
.res .circle{pointer-events:none}
.res .t{opacity:.17;font-size:15px;font-weight:400}
.res .inner{gap:7px}
.letter{position:absolute;left:50%;font-family:var(--f-slab);font-size:66px;line-height:1;opacity:0;transform:translate(-50%,12px);transition:opacity .7s ease,transform .7s ease,text-shadow .7s;text-shadow:3px 3px 0 rgba(0,0,0,.35)}
.letter.top{top:12%}
.letter.bot{bottom:12%}
.revealed .letter{opacity:.2;transform:translate(-50%,0)}
.revealed .letter.pick{opacity:1;text-shadow:3px 3px 0 rgba(0,0,0,.35),0 0 18px rgba(156,242,213,.7)}
.revealed .circle .ring{color:rgba(238,247,244,.9)}
.need{margin:28px auto 0;max-width:320px;text-align:center;font-size:18px;line-height:1.55;padding:22px 18px;border:1.5px dashed rgba(238,247,244,.45);border-radius:22px}
.need .btn{margin-top:14px;display:inline-block}


/* check (quiz) */
.wrap.mid{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn.sm{font-size:14.5px;padding:7px 14px}
.qbar{height:5px;border-radius:5px;background:rgba(238,247,244,.18);overflow:hidden;margin:14px 0 0}
.qbar i{display:block;height:100%;width:0;background:var(--mint);border-radius:5px;transition:width .35s}
.q-lead{font-family:var(--f-title);font-size:24px;line-height:1.4;text-align:center;margin:30px 0 20px;word-break:keep-all;text-wrap:balance}
.qopt{display:block;width:100%;padding:20px 18px;border-radius:30px 26px 32px 24px/26px 32px 24px 30px;border:1.8px solid rgba(238,247,244,.78);background:rgba(15,36,41,.22);font-size:21px;font-weight:700;line-height:1.45;text-align:center;transition:.2s;word-break:keep-all;overflow-wrap:break-word;text-wrap:balance}
.qopt:active{transform:scale(.985)}
.qopt.on{border-color:var(--mint);background:rgba(156,242,213,.17);box-shadow:0 0 16px rgba(156,242,213,.3)}
.q-or{display:block;text-align:center;font-family:var(--f-title);font-size:15px;letter-spacing:.24em;opacity:.7;margin:10px 0}
.q-help{margin:20px 0 0;text-align:center;font-size:16px;color:var(--ink-2);line-height:1.5;word-break:keep-all;text-wrap:balance}
.q-nav{display:flex;justify-content:center;margin-top:18px;min-height:42px}
.card{margin:22px 0 0;padding:18px 18px 8px;border:1.5px solid rgba(238,247,244,.4);border-radius:26px 22px 28px 20px/22px 28px 20px 26px;background:rgba(15,36,41,.2)}
.pr{display:flex;gap:13px;align-items:flex-start;margin:0 0 14px}
.pr .n{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid var(--mint);color:var(--mint);font-family:var(--f-serif);font-size:15px;display:grid;place-items:center;margin-top:2px}
.pr b{display:block;font-family:var(--f-title);font-weight:400;font-size:18.5px;line-height:1.35}
.pr span.d{display:block;font-size:16px;line-height:1.45;color:var(--ink-2);margin-top:2px}
.pr,.pr b,.pr span.d{word-break:keep-all;overflow-wrap:break-word}
.fine{margin:16px 6px 0;text-align:center;font-size:14.5px;line-height:1.5;color:var(--ink-2);opacity:.9;word-break:keep-all;text-wrap:balance}
.big-check{width:120px;height:120px;margin:34px auto 0;border-radius:50%;border:2px solid var(--mint);display:grid;place-items:center;font-size:56px;color:var(--mint);box-shadow:0 0 22px rgba(156,242,213,.3)}
.inter-t{font-family:var(--f-title);font-size:25px;line-height:1.4;text-align:center;margin:26px 0 0;word-break:keep-all;text-wrap:balance}

/* identity badge */
.tagb{position:absolute;top:7%;left:50%;transform:translateX(-50%);z-index:3;white-space:nowrap;font-family:var(--f-title);font-size:13.5px;letter-spacing:.03em;padding:3px 11px;border-radius:999px;background:var(--night);border:1px solid rgba(156,242,213,.6);color:var(--mint)}
.tagb.warn{border-color:#f3c76b;color:#f3c76b}
.tagb.mine{background:var(--mint);color:var(--night);border-color:var(--mint)}

/* result summary */
.sum{margin:26px auto 0;max-width:340px;padding:16px 16px 6px;border:1.5px solid rgba(238,247,244,.35);border-radius:22px;background:rgba(15,36,41,.25)}
.sum-t{font-family:var(--f-title);font-size:17px;text-align:center;margin:0 0 12px;opacity:.9}
.sr{display:grid;grid-template-columns:26px 1fr 26px;align-items:center;gap:8px;margin-bottom:4px}
.sl{font-family:var(--f-slab);font-size:24px;text-align:center;opacity:.4}
.sl.pick{opacity:1;color:var(--mint)}
.sb{display:flex;height:9px;border-radius:9px;overflow:hidden;background:rgba(238,247,244,.12)}
.sb i{display:block;height:100%}
.sb i.w{background:var(--mint)}.sb i.l{background:rgba(238,247,244,.22)}
.sv{grid-column:1/-1;text-align:center;font-size:14.5px;color:var(--ink-2);margin:0 0 10px}
.sv.warn{color:#f3c76b}
.sum-n{font-size:14.5px;line-height:1.5;color:var(--ink-2);text-align:center;margin:2px 0 12px;word-break:keep-all;text-wrap:balance}

/* gifted */
.tabs{display:flex;gap:8px;justify-content:center;margin-top:14px}
.tab{font-family:var(--f-slab);font-size:17px;letter-spacing:.06em;padding:6px 16px;border-radius:999px;border:1.5px solid rgba(238,247,244,.4);transition:.25s;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--logo);border-color:var(--logo);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.g-head{text-align:center}
.g-head .h-serif{font-size:50px}
.g-head .hint{text-align:center;margin-top:10px}
.gifted .stack{margin-top:16px}
.gifted .circle{width:var(--dg);margin:-14px 0}
.gifted .circle:nth-child(odd){margin-left:-2px}
.gifted .circle:nth-child(even){margin-right:-2px}
.gifted .inner{inset:10.5%;gap:6px}
.gifted .circle.sel .badge{top:10%}
.g-label{font-family:var(--f-slab);font-size:32px;letter-spacing:.05em;line-height:1;text-shadow:2px 2px 0 rgba(0,0,0,.45)}
.g-row{display:flex;align-items:center;gap:8px;text-align:left;margin-top:2px}
.avatar{flex:0 0 96px;width:96px;height:104px;margin-left:-26px;margin-top:-4px;color:var(--logo);align-self:flex-end}
.avatar svg,.avatar img{width:100%;height:100%;display:block}
.avatar img{object-fit:contain;object-position:bottom;filter:grayscale(1) contrast(1.06) drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.g-cap{display:flex;flex-direction:column;gap:2px;min-width:0}
.g-tag{font-size:15px;line-height:1.3;color:var(--ink-2)}
.g-name{font-family:var(--f-title);font-size:19px;line-height:1.25}
.g-desc{margin:4px 0 0;font-size:16px;line-height:1.42;font-weight:700;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.gifted .circle.mine .ring{color:#fff;filter:drop-shadow(0 0 7px var(--logo)) drop-shadow(0 0 3px var(--logo))}
.gifted .circle.mine::before{content:"";position:absolute;inset:5%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.1),transparent)}
.gifted .circle.mine .badge{opacity:1;transform:none;background:var(--logo);color:#fff}
.gifted .circle{opacity:1}
.gifted .circle.other{opacity:.9}

/* end */
.end{display:none}
.end.on{display:flex;align-items:center;justify-content:center}
.end .wm{position:absolute;left:max(20px,calc(50% - 240px + 4px));top:calc(env(safe-area-inset-top,0px) + 26px);color:#27a07c}
.end .logo{width:min(26vw,120px);--logo:#27a97c;opacity:.78}
.end .acts{position:absolute;bottom:calc(var(--dock) + 26px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;gap:10px;justify-content:center}

/* dock */
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:999px;background:rgba(12,32,37,.58);border:1px solid rgba(238,247,244,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .3s,transform .3s}
.dock.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(14px)}
.dk{width:40px;height:40px;border-radius:50%;font-size:26px;line-height:1;display:grid;place-items:center}
.dk[disabled]{opacity:.25}
.dots{display:flex;gap:7px;align-items:center;padding:0 6px}
.dot{width:8px;height:8px;border-radius:999px;background:rgba(238,247,244,.3);transition:.3s}
.dot.cur{width:22px;background:var(--mint)}
.toast{position:fixed;left:50%;bottom:calc(var(--dock) + 66px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:70;max-width:min(88vw,340px);padding:11px 18px;border-radius:16px;background:rgba(12,32,37,.9);border:1px solid rgba(238,247,244,.2);font-family:var(--f-title);font-size:15.5px;line-height:1.45;text-align:center;opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* sheet (reflect card view) */
.sheet{position:fixed;inset:0;z-index:80;display:none;background:rgba(9,24,28,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.sheet.on{display:flex;animation:fadein .3s both}
.sheet .circle{--d:min(calc(100vw - 28px),400px);margin:0;align-self:center!important}
.sheet .c-title{font-size:26px}
.sheet .c-q{font-size:21px}
.sheet .count{font-family:var(--f-title);font-size:15px;letter-spacing:.1em;color:var(--ink-2)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:520px){:root{--d:348px;--dg:376px}}
</style>
</head>
<body data-theme="NF">
<div class="grain" aria-hidden="true"></div>

<main>
<!-- 1. cover -->
<section class="screen cover on" id="s-cover" data-screen="cover" aria-label="표지">
  <div class="wm"><b>CALEB</b><span>COMMUNITY</span></div>
  <div class="stage">
    <div class="logo" role="img" aria-label="갈렙 공동체 로고"></div>
    <svg class="arc" viewBox="0 330 1688 1850" aria-hidden="true">
      <defs><path id="arcPath" d="M 330 2092 A 1640 1640 0 0 0 1500 400"/></defs>
      <text font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="150" fill="#d3eef3" letter-spacing="14"><textPath href="#arcPath">LET’S BREAK THE ICE!</textPath></text>
    </svg>
  </div>
  <button class="start" type="button" id="startBtn">2027 · 탭해서 시작</button>
</section>

<!-- 2. reflect -->
<section class="screen" id="s-reflect" data-screen="reflect" aria-label="REFLECT">
  <div class="wrap">
    <div class="title-row"><h1 class="h-serif">REFLECT</h1><span class="chip" id="rCount">0 / 2</span></div>
    <p class="lead">2가지만 선택해서 나눠봅시다</p>
    <div class="stack" id="rStack"></div>
    <div class="actions">
      <button class="btn ghost" type="button" id="rRandom">랜덤으로 고르기</button>
      <button class="btn ghost" type="button" id="rClear">다시 고르기</button>
      <button class="btn primary" type="button" id="rGo" disabled>나눔 시작</button>
    </div>
  </div>
</section>

<!-- 3. check (quiz) -->
<section class="screen" id="s-check" data-screen="check" aria-label="DISCOVER">
  <div class="wrap" id="cWrap"><div id="cBody"></div></div>
</section>

<!-- 4. identity -->
<section class="screen" id="s-identity" data-screen="identity" aria-label="IDENTITY">
  <div class="wrap">
    <div class="id-head"><div class="logo" aria-hidden="true"></div><h1 class="h-serif">IDENTITY</h1><span class="chip" id="iCount">최종 확인</span></div>
    <p class="hint" id="iHint" style="text-align:center">검사 결과가 미리 표시되어 있어요.<br>더 나다운 쪽이 다르면 눌러서 바꿔 주세요.<br>최종 결정은 언제나 본인의 몫이에요.</p>
    <div id="iBody"></div>
    <div class="actions" id="iActions">
      <button class="btn ghost" type="button" id="iRetake">검사 다시 하기</button>
      <button class="btn primary" type="button" id="iGo">이대로 결과 보기</button>
    </div>
  </div>
</section>

<!-- 5. result -->
<section class="screen res" id="s-result" data-screen="result" aria-label="결과">

var NB=24;
function itemOf(id){
  var ax,k,d,flip;
  if(id<NB){ax=id%4;k=(id-ax)/4;d=BANK[ax].b[k];flip=(k+ax)%2}
  else{ax=Math.floor((id-NB)/3);k=(id-NB)%3;d=BANK[ax].r[k];flip=(k+ax+1)%2}
  return {id:id,ax:ax,q:d[0],p:[d[1],d[2]],flip:flip};
}
function got(id){return S.ans[id]===0||S.ans[id]===1}
function cnt(ids){var a0=0,a1=0;ids.forEach(function(i){if(S.ans[i]===0)a0++;else if(S.ans[i]===1)a1++});return {a0:a0,a1:a1,n:a0+a1}}
function baseIds(ax){var r=[],k;for(k=0;k<6;k++)r.push(k*4+ax);return r}
function extraIds(ax){return [NB+ax*3,NB+ax*3+1,NB+ax*3+2]}
function needExtra(ax){var b=cnt(baseIds(ax));return b.n===6&&b.a0===3}
function queue(){
  var q=[],i,r,ax;for(i=0;i<NB;i++)q.push(i);
  if(q.every(got)){for(r=0;r<3;r++)for(ax=0;ax<4;ax++)if(needExtra(ax))q.push(NB+ax*3+r)}
  return q;
}
function testDone(){return queue().every(got)}
function firstOpen(q){for(var i=0;i<q.length;i++)if(!got(q[i]))return i;return -1}
function analyze(ax){
  var b=cnt(baseIds(ax)),a0=b.a0,a1=b.a1,e,t,win,share;
  if(needExtra(ax)){e=cnt(extraIds(ax));a0+=e.a0;a1+=e.a1}
  t=a0+a1;win=a0>=a1?0:1;share=t?Math.max(a0,a1)/t:0;
  return {a0:a0,a1:a1,t:t,win:win,share:share,level:share>=0.83?'선명':(share>=0.66?'보통':'경계')};
}
function finalize(){
  S.id=testDone()?[0,1,2,3].map(function(ax){return analyze(ax).win===0?'A':'B'}):[null,null,null,null];
  S.ov=[false,false,false,false];S.revealed=false;
}

function answer(v){

  $('#gStack').innerHTML=GROUPS[g].map(function(ty,i){
    var p=PEOPLE[ty],isMine=mine===ty;
    return '<div class="circle'+(isMine?' mine':' other')+'" data-t="'+ty+'">'+ringSVG(i*5+g.charCodeAt(0))+'<span class="badge">나의 유형</span><div class="inner"><span class="g-label">'+ty+'</span><div class="g-row"><span class="avatar">'+avatarFor(ty,p.name)+'</span><span class="g-cap"><span class="g-tag">'+esc(p.tag)+'</span><span class="g-name">'+esc(p.name)+'</span></span></div><p class="g-desc">'+esc(p.desc)+'</p></div></div>';
  }).join('');
}

/* ---------- navigation ---------- */
var ORDER=['cover','reflect','check','identity','result','gifted','end'];
var LABEL={cover:'표지',reflect:'REFLECT',check:'DISCOVER',identity:'IDENTITY',result:'결과',gifted:'GIFTED',end:'마지막'};
var cur='cover';
function buildDots(){
  $('#dots').innerHTML=ORDER.map(function(n){return '<button type="button" class="dot" data-n="'+n+'" aria-label="'+LABEL[n]+'"></button>'}).join('');
  $$('#dots .dot').forEach(function(d){d.addEventListener('click',function(){go(d.getAttribute('data-n'))})});
}
function go(name,fromHash){
  if(ORDER.indexOf(name)<0)name='cover';
  cur=name;
  $$('.screen').forEach(function(s){s.classList.toggle('on',s.getAttribute('data-screen')===name)});
  var sc=$('#s-'+name);sc.scrollTop=0;
  document.body.setAttribute('data-theme',name==='gifted'?S.group:'NF');
  if(name==='reflect')renderReflect();
  if(name==='check'){Q.stage='intro';renderCheck()}
  if(name==='identity')renderIdentity();
  if(name==='result')renderResult();
  if(name==='gifted'){renderGifted();var m=$('#gStack .circle.mine');if(m)setTimeout(function(){m.scrollIntoView({block:'center',behavior:'smooth'})},450)}
  var i=ORDER.indexOf(name);
  updateDock();
  $$('#dots .dot').forEach(function(d,k){d.classList.toggle('cur',k===i)});
  $('#prev').disabled=i===0;$('#next').disabled=i===ORDER.length-1;
  $('#sheet').classList.remove('on');
  if(!fromHash){try{if(location.hash!=='#'+name)location.hash=name}catch(e){}}
}
$('#prev').addEventListener('click',function(){go(ORDER[Math.max(0,ORDER.indexOf(cur)-1)])});
$('#next').addEventListener('click',function(){go(ORDER[Math.min(ORDER.length-1,ORDER.indexOf(cur)+1)])});
$('#s-cover').addEventListener('click',function(){go('reflect')});
$('#eHome').addEventListener('click',function(){go('cover')});
$('#eReset').addEventListener('click',function(){S={reflect:[],ans:{},id:[null,null,null,null],ov:[false,false,false,false],revealed:false,group:'NF'};save();toast('선택을 모두 지웠어요.');go('cover')});
window.addEventListener('hashchange',function(){var n=location.hash.replace('#','');if(n&&n!==cur)go(n,true)});

/* swipe */
(function(){
  var x0=0,y0=0,t0=0,on=false;
  document.addEventListener('touchstart',function(e){if(e.touches.length!==1||$('#sheet').classList.contains('on')){on=false;return}var t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();on=!e.target.closest('.hold')&&!(cur==='check'&&(Q.stage==='q'||Q.stage==='inter'))},{passive:true});
  document.addEventListener('touchend',function(e){
    if(!on)return;var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>90&&Math.abs(dy)<45&&Date.now()-t0<600){var i=ORDER.indexOf(cur);if(dx<0&&i<ORDER.length-1)go(ORDER[i+1]);else if(dx>0&&i>0)go(ORDER[i-1])}
  },{passive:true});
})();

buildReflect();buildTabs();buildDots();
var h0=location.hash.replace('#','');
go(ORDER.indexOf(h0)>=0?h0:'cover',true);
})();
</script>
</body>
</html>
